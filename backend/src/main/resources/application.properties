server.address=127.0.0.1
server.port=${APP_PORT:8088}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
spring.application.name=antifraud
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:antifraud_course}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USER:antifraud_dev}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=12
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.storage=${APP_STORAGE:../.local/uploads}
app.key=${APP_KEY}
app.seed=${APP_SEED:true}
logging.file.name=${APP_LOG:../.local/logs/application.log}
